<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbitly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap">
<style>
body{margin:0;background:#F4F4F8}
a{color:#6B5CE7;text-decoration:none}a:hover{color:#4A3DBB}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.nav:hover{background:rgba(255,255,255,.1)}
.btn:hover{filter:brightness(.95)}
.row:hover{background:#F8F8FC}
.card{transition:transform .12s,box-shadow .12s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,22,26,.08)}
.pcard:hover{box-shadow:0 12px 28px rgba(23,22,26,.09)}
.tile:hover{transform:translateY(-2px)}
:focus-visible{outline:2px solid #6B5CE7;outline-offset:2px}

#app{min-height:100vh}
[data-k]{}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #F4F4F8; font-family: 'Poppins', system-ui, sans-serif; color: #17161A; font-size: 14px; line-height: 1.5">

  <aside style="flex: 0 0 248px; background: #4A3DBB; color: #FFFFFF; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: #F7D84E; display: grid; place-items: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17161A" stroke-width="2.2"><circle cx="12" cy="12" r="4"></circle><path d="M3 12a9 9 0 0 1 18 0"></path></svg>
      </div>
      <span style="font-weight: 400; font-size: 20px; letter-spacing: -0.02em">Orbitly</span>
      <button onClick="{{toggleLang}}" aria-label="{{L.switchLang}}" title="{{L.switchLang}}" style="margin-left: auto; height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #FFFFFF; font-size: 12px; font-weight: 500; letter-spacing: .04em">{{langLabel}}</button>
    </div>
    <div style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #C9C4F5; padding: 4px 12px 8px; font-weight: 400">{{L.overview}}</div>
    <sc-for list="{{nav1}}" as="n" hint-placeholder-count="1">
      <button class="nav" onClick="{{n.go}}" style="{{n.style}}">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: {{n.dot}}; flex: 0 0 auto"></span>
        <span>{{n.label}}</span>
        <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{true}}">
          <span style="margin-left: auto; background: #E2503B; color: #FFFFFF; font-size: 11px; font-weight: 400; border-radius: 99px; padding: 2px 8px">{{n.badge}}</span>
        </sc-if>
      </button>
    </sc-for>
    <div style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #C9C4F5; padding: 16px 12px 8px; font-weight: 400">{{L.work}}</div>
    <sc-for list="{{nav2}}" as="n" hint-placeholder-count="4">
      <button class="nav" onClick="{{n.go}}" style="{{n.style}}">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: {{n.dot}}; flex: 0 0 auto"></span>
        <span>{{n.label}}</span>
      </button>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="background: rgba(255,255,255,.12); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; color: #E6E3FA; font-weight: 500">{{L.allWork}}</span>
        <span style="font-size: 12px; color: #F7D84E">{{avgPct}}% {{L.doneL}}</span>
      </div>
      <div style="height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden"><div style="{{avgBarStyle}}"></div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 8px 2px">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #F7D84E; color: #17161A; display: grid; place-items: center; font-size: 12px; font-weight: 400">EJ</span>
      <div style="display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-weight: 400; font-size: 14px">Emma Johnson</span>
        <span style="font-size: 12px; color: #C9C4F5">{{L.role}}</span>
      </div>
      <button onClick="{{resetDemo}}" title="{{L.resetDemo}}" aria-label="{{L.resetDemo}}" style="margin-left: auto; width: 32px; height: 32px; border-radius: 10px; border: 0; background: rgba(255,255,255,.1); color: #E6E3FA; display: grid; place-items: center">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg>
      </button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 14px; padding: 9px 14px; flex: 1 1 260px; max-width: 460px; color: #6B6A72">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" placeholder="{{searchPlaceholder}}" value="{{q}}" onChange="{{onQ}}" style="border: 0; outline: 0; background: transparent; font-size: 14px; flex: 1; color: #17161A; min-width: 0">
      </label>
      <div style="flex: 1"></div>
      <button aria-label="{{L.overdueTasks}}" title="{{L.overdueTasks}}" onClick="{{goOverdue}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E4E4EC; background: #FFFFFF; display: grid; place-items: center; position: relative; color: #17161A">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"></path></svg>
        <sc-if value="{{hasLate}}" hint-placeholder-val="{{true}}">
          <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: #E2503B; color: #FFFFFF; font-size: 10px; font-weight: 400; display: grid; place-items: center; border: 2px solid #F4F4F8">{{lateN}}</span>
        </sc-if>
      </button>
      <button class="btn" onClick="{{newProject}}" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #E4E4EC; background: #FFFFFF; font-weight: 400; font-size: 14px; color: #17161A">{{L.newProject}}</button>
      <button class="btn" onClick="{{newTask}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: #F7D84E; font-weight: 400; font-size: 14px; color: #17161A">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg>
        {{L.createTask}}
      </button>
    </header>

    <!-- DASHBOARD -->
    <sc-if value="{{isDashboard}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; color: #6B6A72; font-weight: 500">{{todayLabel}}</span>
            <h1 style="margin: 0; font-weight: 400; font-size: 42px; letter-spacing: -0.03em; line-height: 1.05">{{greeting}}, Emma.</h1>
          </div>
          <p style="margin: 0; color: #6B6A72; max-width: 400px; font-size: 14px">{{summaryLine}}</p>
        </div>

        <section aria-label="{{L.keyNumbers}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px">
          <button class="tile" onClick="{{goProjects}}" style="text-align: left; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; color: #17161A">
            <span style="font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A72; font-weight: 400">{{L.projects}}</span>
            <span style="font-size: 46px; font-weight: 400; letter-spacing: -0.03em; line-height: 1">{{nProjects}}</span>
            <span style="font-size: 13px; color: #6B6A72">{{nProjectsActive}} {{L.withOpenWork}}</span>
          </button>
          <button class="tile" onClick="{{goActive}}" style="text-align: left; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; color: #17161A">
            <span style="font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A72; font-weight: 400">{{L.activeTasks}}</span>
            <span style="font-size: 46px; font-weight: 400; letter-spacing: -0.03em; line-height: 1; color: #6B5CE7">{{nActive}}</span>
            <span style="font-size: 13px; color: #6B6A72">{{nProg}} {{L.inProgressL}}, {{nTodo}} {{L.toDoL}}</span>
          </button>
          <button class="tile" onClick="{{goDone}}" style="text-align: left; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; color: #17161A">
            <span style="font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6B6A72; font-weight: 400">{{L.completed}}</span>
            <span style="font-size: 46px; font-weight: 400; letter-spacing: -0.03em; line-height: 1; color: #1E9E5A">{{nDone}}</span>
            <span style="font-size: 13px; color: #6B6A72">{{avgPct}}% {{L.ofAllWork}}</span>
          </button>
          <button class="tile" onClick="{{goOverdue}}" style="text-align: left; background: #6B5CE7; color: #FFFFFF; border: 0; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
            <span style="font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #E6E3FA; font-weight: 400">{{L.overdue}}</span>
            <span style="font-size: 46px; font-weight: 400; letter-spacing: -0.03em; line-height: 1">{{lateN}}</span>
            <span style="font-size: 13px; color: #E6E3FA">{{lateHint}}</span>
          </button>
        </section>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
          <section aria-label="{{L.projectProgress}}" style="background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
              <h2 style="margin: 0; font-size: 20px; font-weight: 400; letter-spacing: -0.02em">{{L.projectProgress}}</h2>
              <button onClick="{{goProjects}}" style="border: 0; background: none; font-size: 13px; font-weight: 400; color: #6B5CE7; padding: 0">{{L.allProjects}}</button>
            </div>
            <sc-for list="{{projRows}}" as="p" hint-placeholder-count="3">
              <button class="row" onClick="{{p.open}}" style="text-align: left; border: 0; background: none; color: #17161A; display: grid; grid-template-columns: 48px 1fr auto; gap: 6px 14px; align-items: center; padding: 10px 10px; border-radius: 14px; margin: 0 -10px">
                <span style="{{p.keyStyle}}">{{p.key}}</span>
                <span style="font-weight: 400; font-size: 15px">{{p.name}}</span>
                <span style="font-size: 12px; color: #6B6A72">{{p.meta}}</span>
                <span style="grid-column: 2 / -1; height: 8px; border-radius: 99px; background: #F4F4F8; overflow: hidden; display: flex">
                  <span style="{{p.doneStyle}}"></span><span style="{{p.progStyle}}"></span>
                </span>
              </button>
            </sc-for>
            <sc-if value="{{noProjects}}" hint-placeholder-val="{{false}}">
              <div style="color: #6B6A72; padding: 18px; text-align: center; border: 1.5px dashed #E4E4EC; border-radius: 14px">{{L.noProjects}}</div>
            </sc-if>
          </section>

          <section aria-label="{{L.overdueTasks}}" style="background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px">
              <h2 style="margin: 0; font-size: 20px; font-weight: 400; letter-spacing: -0.02em">{{L.overdue}}</h2>
              <span style="background: #FFE3DC; color: #9A2E1B; font-size: 12px; font-weight: 400; border-radius: 99px; padding: 2px 9px">{{lateN}}</span>
              <button onClick="{{goOverdue}}" style="margin-left: auto; border: 0; background: none; font-size: 13px; font-weight: 400; color: #6B5CE7; padding: 0">{{L.seeAll}}</button>
            </div>
            <sc-for list="{{lateTasks}}" as="t" hint-placeholder-count="3">
              <button class="row" onClick="{{t.open}}" style="text-align: left; border: 0; background: none; color: #17161A; display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 14px; margin: 0 -10px">
                <span style="font-size: 12px; color: #6B6A72; flex: 0 0 64px">{{t.key}}</span>
                <span style="flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.title}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #E2503B; background: #FFE3DC; border-radius: 8px; padding: 3px 9px; white-space: nowrap">{{t.lateLabel}}</span>
                <span style="{{t.avStyle}}" title="{{t.assignee}}">{{t.ini}}</span>
              </button>
            </sc-for>
            <sc-if value="{{noLate}}" hint-placeholder-val="{{false}}">
              <div style="color: #6B6A72; padding: 18px; text-align: center; border: 1.5px dashed #E4E4EC; border-radius: 14px">{{L.nothingOverdue}}</div>
            </sc-if>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- PROJECTS -->
    <sc-if value="{{isProjects}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; color: #6B6A72; font-weight: 500">{{projectsLine}}</span>
            <h1 style="margin: 0; font-weight: 400; font-size: 42px; letter-spacing: -0.03em; line-height: 1.05">{{L.projects}}</h1>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 18px">
          <sc-for list="{{projCards}}" as="p" hint-placeholder-count="3">
            <div class="pcard" style="background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 230px; box-sizing: border-box; transition: box-shadow .12s">
              <div style="display: flex; align-items: flex-start; gap: 10px">
                <span style="{{p.keyStyleLg}}">{{p.key}}</span>
                <span style="margin-left: auto; font-size: 12px; font-weight: 400; background: #F4F4F8; color: #6B6A72; border-radius: 99px; padding: 4px 10px">{{p.badge}}</span>
                <button aria-label="{{L.editProject}}" onClick="{{p.edit}}" style="width: 32px; height: 32px; border-radius: 10px; border: 1px solid #E4E4EC; background: #FFFFFF; color: #6B6A72; display: grid; place-items: center">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l10-10-4-4L4 16zM13 7l4 4"></path></svg>
                </button>
              </div>
              <button onClick="{{p.open}}" style="text-align: left; border: 0; background: none; padding: 0; color: #17161A; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 22px; font-weight: 400; letter-spacing: -0.02em">{{p.name}}</span>
                <span style="color: #6B6A72; font-size: 14px">{{p.desc}}</span>
              </button>
              <div style="flex: 1"></div>
              <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #6B6A72">
                <span>{{p.meta}}</span>
                <span style="color: #17161A">{{p.pct}}%</span>
              </div>
              <div style="height: 8px; border-radius: 99px; background: #F4F4F8; overflow: hidden"><span style="{{p.pctStyle}}"></span></div>
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{p.people}}" as="u" hint-placeholder-count="2">
                  <span style="{{u.avStyle}}" title="{{u.name}}">{{u.ini}}</span>
                </sc-for>
                <button onClick="{{p.open}}" style="margin-left: auto; height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #6B5CE7; color: #FFFFFF; font-weight: 400; font-size: 13px">{{L.openBoard}}</button>
              </div>
            </div>
          </sc-for>
          <button onClick="{{newProject}}" style="background: transparent; border: 1.5px dashed #C9C7CF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 230px; color: #6B6A72; box-sizing: border-box">
            <span style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E4E4EC; display: grid; place-items: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"></path></svg>
            </span>
            <span style="font-weight: 400; font-size: 15px">{{L.startProject}}</span>
            <span style="font-size: 13px">{{L.startProjectHint}}</span>
          </button>
        </div>
      </div>
    </sc-if>

    <!-- PROJECT VIEWS -->
    <sc-if value="{{isProject}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <nav aria-label="{{L.breadcrumb}}" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B6A72">
          <button onClick="{{goProjects}}" style="border: 0; background: none; color: #6B6A72; padding: 0">{{L.projects}}</button>
          <span>/</span>
          <span style="color: #17161A; font-weight: 400">{{cur.name}}</span>
        </nav>
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
          <span style="{{cur.keyStyleXl}}">{{cur.key}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <h1 style="margin: 0; font-weight: 400; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05">{{cur.name}}</h1>
            <span style="color: #6B6A72; font-size: 14px">{{cur.desc}} · {{cur.pct}}% {{L.complete}}</span>
          </div>
          <div style="flex: 1"></div>
          <div style="display: flex; align-items: center">
            <sc-for list="{{cur.people}}" as="u" hint-placeholder-count="3">
              <span style="{{u.avStyleStack}}" title="{{u.name}}">{{u.ini}}</span>
            </sc-for>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 14px; padding: 0 12px; height: 44px">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{L.switchProject}}</span>
            <sc-raw-select value="{{cur.id}}" onChange="{{switchProject}}" style="border: 0; background: transparent; outline: 0; font-weight: 400; font-size: 14px; color: #17161A; max-width: 220px">
              <sc-for list="{{projectOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for>
            </sc-raw-select>
          </label>
          <button class="btn" onClick="{{editCur}}" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #E4E4EC; background: #FFFFFF; font-weight: 400; font-size: 14px; color: #17161A">{{L.edit}}</button>
          <button class="btn" onClick="{{deleteCur}}" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #E4E4EC; background: #FFFFFF; font-weight: 400; font-size: 14px; color: #9A2E1B">{{L.delete}}</button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
          <nav aria-label="{{L.projectViews}}" style="display: inline-flex; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 14px; padding: 4px; gap: 2px">
            <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
              <button onClick="{{tb.go}}" style="{{tb.style}}">{{tb.label}}</button>
            </sc-for>
          </nav>
          <div style="flex: 1"></div>
          <div style="display: flex; align-items: center">
            <sc-for list="{{people}}" as="u" hint-placeholder-count="3">
              <button onClick="{{u.pick}}" aria-label="{{u.name}}" title="{{u.name}}" style="{{u.filterStyle}}">{{u.ini}}</button>
            </sc-for>
          </div>
          <label style="{{catChipStyle}}">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{L.category}}</span>
            <sc-raw-select value="{{fcat}}" onChange="{{onCat}}" style="border: 0; background: transparent; outline: 0; font-weight: 400; font-size: 13px; color: inherit">
              <option value="">{{L.category}}</option>
              <sc-for list="{{catOptions}}" as="c" hint-placeholder-count="5"><option value="{{c.v}}">{{c.label}}</option></sc-for>
            </sc-raw-select>
          </label>
          <button onClick="{{toggleMine}}" style="{{mineChipStyle}}">{{L.mine}}</button>
          <button onClick="{{toggleLate}}" style="{{lateChipStyle}}">{{L.overdue}}</button>
          <sc-if value="{{hasFilters}}" hint-placeholder-val="{{false}}">
            <button onClick="{{clearFilters}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; font-weight: 400; font-size: 13px; color: #6B5CE7">{{L.clear}}</button>
          </sc-if>
        </div>

        <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #17161A; color: #FFFFFF; border-radius: 14px; padding: 8px 8px 8px 16px">
            <span style="font-weight: 400; font-size: 13px">{{selN}} {{L.selected}}</span>
